manifestVersion: 1
id: digiforge-dgb-pool
category: finance
name: DigiForge
version: "1.1.3"
tagline: Private multi-algorithm DigiByte mining on Umbrel
description: >-
  DigiForge is a self-hosted multi-algorithm DigiByte mining hub for umbrelOS.
  It combines a pruned DigiByte Core node, private Miningcore SHA256 and Scrypt
  pools, PostgreSQL persistence, and the custom DigiForge setup and monitoring
  UI. DigiByte RPC, PostgreSQL, and the Miningcore API stay private inside the
  app.
developer: Mikal
website: https://github.com/softgamesby/digiforge-umbrel-app-store
dependencies: []
repo: https://github.com/softgamesby/digiforge-umbrel-app-store
support: https://github.com/softgamesby/digiforge-umbrel-app-store/issues
port: 21036
gallery: []
path: ""
defaultPassword: ""
releaseNotes: >-
  DigiForge 1.1.3 preserves rejected DigiByte block candidates in Miningcore
  history instead of discarding them after daemon submission. The dashboard
  now distinguishes accepted blocks from rejected candidates and records
  worker, algorithm, and rejection reason where available. Existing accepted-
  block, payout, and round-effort semantics are preserved, while PostgreSQL
  schema changes are applied automatically to existing installations.
