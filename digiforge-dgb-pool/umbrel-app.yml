port: 21036
gallery: []
path: ""
defaultPassword: ""
releaseNotes: >-
  DigiForge 1.0.8 corrects the headline pool hashrate using a six-hour
  accepted-work estimate and uses that effective rate for statistical
  expected block time and pool network share, while retaining Miningcore's
  shorter-window estimate separately. This release also adds a read-only
  Support DigiForge section for BTC, ETH, DOGE, LTC, and DGB public wallet
  addresses and expands DigiForge / Developed by Mikal attribution.
  Bitaxe/ASIC port 3256 and NerdMiner port 3257 remain unchanged.
