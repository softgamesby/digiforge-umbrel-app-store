defaultPassword: ""
releaseNotes: >-
  DigiForge 1.0.9 is a maintenance and bug-fix release that updates official
  repository, support, icon, and container image references following the
  publisher account update. It preserves the verified runtime image digests
  and existing mining configuration while preventing broken links and future
  image-pull or update failures caused by outdated references. Bitaxe/ASIC
  port 3256 and NerdMiner port 3257 remain unchanged.
