manifestVersion: 1
id: digiforge-dgb-pool
category: finance
name: DigiForge
version: "1.0.7"
tagline: Private DigiByte SHA256 mining on Umbrel
description: >-
  DigiForge is a self-hosted DigiByte SHA256 mining hub for umbrelOS.
  It combines a pruned DigiByte Core node, a private Miningcore SHA256 pool,
  PostgreSQL persistence, and the custom DigiForge setup and monitoring UI.
  DigiByte RPC, PostgreSQL, and the Miningcore API stay private inside the app.
developer: Mikal
website: https://github.com/xlaky1/digiforge-umbrel-app-store
dependencies: []
repo: https://github.com/xlaky1/digiforge-umbrel-app-store
support: https://github.com/xlaky1/digiforge-umbrel-app-store/issues
port: 21036
gallery: []
path: ""
defaultPassword: ""
releaseNotes: >-
  DigiForge 1.0.7 adds mining-round observability, pool block history,
  statistical expected block time, network share and performance metrics,
  plus ACTIVE, IDLE, and STALE worker states with accepted-share activity.
  Round effort is presented as probabilistic expected work rather than
  deterministic block progress. Bitaxe/ASIC port 3256 and NerdMiner port
  3257 remain unchanged.
submitter: Mikal
submission: https://github.com/xlaky1/digiforge-umbrel-app-store
