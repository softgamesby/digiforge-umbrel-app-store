name: Build DigiForge Images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            image: digiforge-web
            context: ./digiforge-dgb-pool
            file: ./digiforge-dgb-pool/web/Dockerfile

          - name: digibyte
            image: digiforge-digibyte
            context: ./digiforge-dgb-pool
            file: ./digiforge-dgb-pool/Dockerfile.digibyte

          - name: miningcore
            image: digiforge-miningcore
            context: ./digiforge-dgb-pool
            file: ./digiforge-dgb-pool/config/Dockerfile.miningcore

          - name: postgres
            image: digiforge-postgres
            context: ./digiforge-dgb-pool
            file: ./digiforge-dgb-pool/Dockerfile.postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          provenance: true
          sbom: true
